# ===== Server =====
server.port=8080

# ===== Database =====
spring.datasource.url=jdbc:postgresql://localhost:5432/cms_db
spring.datasource.username=postgres
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# PostgreSQLDialect is auto-detected by Hibernate 6 – no need to specify it.
spring.jpa.open-in-view=false

# ===== JWT =====
# Read from environment / .env; fall back to an insecure dev placeholder.
jwt.secret=${JWT_SECRET:dev_only_secret_change_this_before_deploy_xxxxxxxxx}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Cloudinary =====
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api_key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:your_api_secret}

# ===== Multipart (Image Upload) =====
spring.servlet.multipart.enabled=true
# Must match ImageService.validateFile() 5 MB limit
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== CORS =====
cors.allowed-origins=http://localhost:3000

# ===== Cookie =====
# Set to true in production (HTTPS). False for local HTTP dev.
server.secure-cookie=false

# ===== Logging =====
logging.level.com.cms=DEBUG
logging.level.org.springframework.security=INFO

# ===== Gemini AI =====
gemini.api.key=${GEMINI_API_KEY:}
