jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha
jwt.expiration=3600000
cloudinary.cloud_name=test-cloud
cloudinary.api_key=123456789012345
cloudinary.api_secret=test-api-secret
cors.allowed-origins=http://localhost:3000

# Datasource – connects to the cms-test-postgres Docker container (port 5433).
# Start it with: docker run -d --name cms-test-postgres -e POSTGRES_DB=cms_test -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -p 5433:5432 postgres:16-alpine
spring.datasource.url=jdbc:postgresql://localhost:5433/cms_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA – DDL auto-creates and drops schema on the test database.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# PostgreSQLDialect is auto-detected by Hibernate 6 – no need to set it explicitly.

# Multipart (ImageController slice tests)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
